name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, re
          v = os.environ["GITHUB_REF_NAME"].lstrip("vV")
          s = open("config.py", encoding="utf-8").read()
          s = re.sub(r'LAUNCHER_VERSION = ".*"', 'LAUNCHER_VERSION = "' + v + '"', s)
          open("config.py", "w", encoding="utf-8").write(s)
          assert 'LAUNCHER_VERSION = "' + v + '"' in s, "version was not written"
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("APP_VERSION=" + v + "\n")
      - name: Build EXE
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name WAVELauncher --icon assets/icon.ico --add-data "assets;assets"
          --collect-all customtkinter --collect-all minecraft_launcher_lib
          main.py
      - name: Portable ZIP
        run: Compress-Archive -Path dist\WAVELauncher\* -DestinationPath WAVE_Launcher_Portable.zip
        shell: pwsh
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found" }
          Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\Languages" | Select-Object -ExpandProperty Name
          $ver = if ($env:APP_VERSION) { $env:APP_VERSION } else { "4.0" }
          & $iscc "/DMyAppVersion=$ver" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with code $LASTEXITCODE" }
      - uses: actions/upload-artifact@v5
        with:
          name: WAVELauncher
          path: |
            installer_output/WAVE_Launcher_Setup.exe
            WAVE_Launcher_Portable.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_output/WAVE_Launcher_Setup.exe
            WAVE_Launcher_Portable.zip
